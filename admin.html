<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin Absensi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a;
    --accent: #4f8ef7; --accent2: #7c6af7;
    --success: #22c55e; --danger: #ef4444; --warn: #f59e0b;
    --text: #e8eaf0; --muted: #8891a8; --radius: 14px;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; -webkit-tap-highlight-color: transparent;}

  /* LOGIN */
  #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 36px 32px; width: 100%; max-width: 360px; text-align: center; }
  .login-card .icon { font-size: 40px; margin-bottom: 12px; }
  .login-card h2 { font-size: 20px; margin-bottom: 6px; }
  .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  /* LAYOUT */
  #dashboard { display: none; }
  .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .topbar h1 { font-size: 17px; font-weight: 600; white-space: nowrap; }
  .topbar-right { display: flex; gap: 8px; align-items: center; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--card); padding: 0 20px; }
  .tab { padding: 12px 18px; font-size: 14px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); transition: all 0.15s; white-space: nowrap; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .content { padding: 20px; max-width: 1100px; margin: 0 auto; }

  /* CARDS & STATS */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stat-card .num { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
  .stat-card .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .num-hadir { color: var(--success); } .num-izin { color: var(--accent); }
  .num-sakit { color: var(--warn); }   .num-total { color: var(--text); }

  /* SESI PANEL */
  .sesi-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .sesi-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .sesi-aktif-info { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .sesi-aktif-info .judul { font-size: 12px; color: var(--success); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .sesi-detail-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .sesi-detail-row .dk { color: var(--muted); }
  .sesi-detail-row .dv { font-weight: 600; }
  .no-sesi { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.25); border-radius: 12px; padding: 16px; margin-bottom: 16px; color: var(--warn); font-size: 14px; }

  /* FORM FIELDS */
  .field { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  .field input, .field select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field select option { background: var(--card); }

  /* FILTER & TABLE */
  .filter-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-row input, .filter-row select {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 12px;
    font-size: 14px; font-family: inherit; outline: none;
  }
  .filter-row input { flex: 1; min-width: 150px; }
  .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 11px 14px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-hadir { background: rgba(34,197,94,0.15); color: var(--success); }
  .badge-izin  { background: rgba(79,142,247,0.15); color: var(--accent); }
  .badge-sakit { background: rgba(245,158,11,0.15); color: var(--warn); }

  /* BUTTONS */
  .btn { padding: 9px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger  { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
  .btn-ghost   { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-full    { width: 100%; padding: 11px; font-size: 14px; }

  /* ALERTS */
  .alert { padding: 11px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; display: none; }
  .alert.show { display: block; }
  .alert-danger  { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
  .alert-success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
  .alert-warn    { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3); color: #fbbf24; }

  .empty-state { text-align: center; padding: 40px 24px; color: var(--muted); }
  .empty-state .icon { font-size: 32px; margin-bottom: 10px; }
  #loadingSpinner { text-align: center; padding: 36px; color: var(--muted); font-size: 14px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; margin-bottom: 20px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="icon"></div>
    <h2>Admin Absensi</h2>
    <p>Masuk untuk mengelola absensi</p>
    <div id="alertLogin" class="alert alert-danger"></div>
    <div class="field" style="margin-bottom:14px;">
      <label>Password admin</label>
      <input type="password" id="inputPass" placeholder="Masukkan password" onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <button class="btn btn-primary btn-full" onclick="doLogin()">Masuk</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <h1>Dashboard Absensi</h1>
    <div class="topbar-right">
      <button class="btn btn-ghost" onclick="muatData(true)">Refresh</button>
      <button class="btn btn-ghost" onclick="muatData(false)">↺ Muat ulang</button>
      <button class="btn btn-danger" onclick="doLogout()">Keluar</button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" onclick="bukaTab('tabData', this)">Data Absensi</div>
    <div class="tab" onclick="bukaTab('tabSesi', this)">Kelola Sesi</div>
  </div>

  <!-- TAB: DATA ABSENSI -->
  <div class="tab-panel active" id="tabData">
    <div class="content">
      <div id="alertDash" class="alert"></div>
      <div class="stats-row">
        <div class="stat-card"><div class="num num-total" id="statTotal">—</div><div class="lbl">Total</div></div>
        <div class="stat-card"><div class="num num-hadir" id="statHadir">—</div><div class="lbl">Hadir</div></div>
        <div class="stat-card"><div class="num num-izin"  id="statIzin">—</div><div class="lbl">Izin</div></div>
        <div class="stat-card"><div class="num num-sakit" id="statSakit">—</div><div class="lbl">Sakit</div></div>
      </div>
      <div class="filter-row">
        <input type="text" id="filterCari" placeholder="Cari nama atau NIM..." oninput="filterData()">
        <select id="filterStatus" onchange="filterData()">
          <option value="">Semua status</option>
          <option value="Hadir">Hadir</option>
          <option value="Izin">Izin</option>
          <option value="Sakit">Sakit</option>
        </select>
        <select id="filterSesi" onchange="filterData()">
          <option value="">Semua sesi</option>
        </select>
        <button class="btn btn-primary" onclick="exportCSV()">CSV</button>
        <select id="pilihanSalin" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none;">
          <optgroup label="— Per status —">
            <option value="status:semua">Semua status</option>
            <option value="status:Hadir" selected>Hadir saja</option>
            <option value="status:Izin">Izin saja</option>
            <option value="status:Sakit">Sakit saja</option>
          </optgroup>
          <optgroup label="— Per sesi —" id="optgroupSesi"></optgroup>
        </select>
        <button class="btn btn-ghost" onclick="salinDaftar()">Salin</button>
      </div>
      <div class="table-wrap">
        <div id="loadingSpinner">Memuat data...</div>
        <table id="tabelAbsen" style="display:none;">
          <thead>
            <tr><th>#</th><th>Waktu</th><th>Nama</th><th>NIM/NIS</th><th>Kelas</th><th>Sesi</th><th>Status</th><th>Keterangan</th></tr>
          </thead>
          <tbody id="tbodyAbsen"></tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display:none;">
          <div class="icon"></div><p>Belum ada data absensi</p>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB: KELOLA SESI -->
  <div class="tab-panel" id="tabSesi">
    <div class="content">

      <!-- Info sesi aktif -->
      <div id="infoSesiAktif"></div>

      <!-- Form set sesi baru -->
      <div class="sesi-card">
        <h3>Aktifkan sesi baru</h3>
        <div id="alertSesi" class="alert"></div>
        <div class="form-grid">
          <div class="field full">
            <label>Nama kelas / mata kuliah</label>
            <input type="text" id="sKelas" placeholder="Contoh: Pemrograman Web A">
          </div>
          <div class="field full">
            <label>Nama sesi / pertemuan</label>
            <input type="text" id="sSesi" placeholder="Contoh: Pertemuan 6">
          </div>
          <div class="field">
            <label>Jam mulai</label>
            <input type="number" id="sJamMulai" min="0" max="23" value="7">
          </div>
          <div class="field">
            <label>Menit mulai</label>
            <input type="number" id="sMemulai" min="0" max="59" value="0">
          </div>
          <div class="field">
            <label>Jam selesai</label>
            <input type="number" id="sJamSelesai" min="0" max="23" value="8">
          </div>
          <div class="field">
            <label>Menit selesai</label>
            <input type="number" id="sMeSelesai" min="0" max="59" value="30">
          </div>
          <hr class="divider full">
          <div class="field full">
            <label>Latitude pusat (titik kampus)</label>
            <input type="number" id="sLat" step="any" placeholder="Contoh: 4.295392">
          </div>
          <div class="field full">
            <label>Longitude pusat (titik kampus)</label>
            <input type="number" id="sLng" step="any" placeholder="Contoh: 98.083485">
          </div>
          <div class="field full">
            <label>Radius maksimal (meter)</label>
            <input type="number" id="sRadius" value="200" min="10">
          </div>
        </div>
        <div style="margin-top:16px;">
          <button class="btn btn-success btn-full" id="btnSimpanSesi" onclick="simpanSesi()">
            Aktifkan sesi ini
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<footer>&copy; 2026 ShadowDev - All rights reversed</footer>

<script>
var ADMIN_CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyvuINXYqxoLD-eEspVFK3M9XKXtb2grTJsnwZD2tTChwBmO6ZAIta-dFaTxrK5ivoQdQ/exec",
  PASSWORD: "admin123"
};

var allRecords = [];
var cachedTotal = 0;

// ── Fetch helper dengan retry ─────────────────
function fetchSafe(url, opsi, coba) {
  coba = coba || 0;
  return fetch(url, opsi || { redirect: 'follow' })
    .then(function(r) { return r.text(); })
    .then(function(t) {
      if (t.trim().charAt(0) !== '{') {
        if (coba < 2) return fetchSafe(url, opsi, coba + 1);
        throw new Error('Server mengembalikan respons tidak valid. Coba refresh halaman.');
      }
      return JSON.parse(t);
    })
    .catch(function(e) {
      if (coba < 2 && e.message.indexOf('tidak valid') === -1) return fetchSafe(url, opsi, coba + 1);
      throw e;
    });
}

// ── Auth ──────────────────────────────────────
function doLogin() {
  var pass = document.getElementById('inputPass').value;
  var alertEl = document.getElementById('alertLogin');
  if (pass === ADMIN_CONFIG.PASSWORD) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    muatData();
    muatInfoSesi();
  } else {
    alertEl.className = 'alert alert-danger show';
    alertEl.textContent = 'Password salah.';
  }
}

function doLogout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('inputPass').value = '';
}

// ── Tabs ──────────────────────────────────────
function bukaTab(id, el) {
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.className = 'tab-panel'; });
  document.querySelectorAll('.tab').forEach(function(t) { t.className = 'tab'; });
  document.getElementById(id).className = 'tab-panel active';
  el.className = 'tab active';
}

// ── Data absensi ──────────────────────────────
function muatData(incremental) {
  var spinner = document.getElementById('loadingSpinner');
  var tabel   = document.getElementById('tabelAbsen');

  // Full reload: reset semua
  if (!incremental) {
    allRecords = [];
    cachedTotal = 0;
    spinner.style.display = 'block';
    tabel.style.display   = 'none';
  }

  var url = ADMIN_CONFIG.SCRIPT_URL + '?action=getAll';
  if (incremental && cachedTotal > 0) url += '&since=' + cachedTotal;

  fetchSafe(url)
    .then(function(res) {
      if (res.status === 'ok') {
        var incoming = res.records || [];

        if (incremental && cachedTotal > 0) {
          // Tambahkan data baru ke depan (server sudah reverse)
          allRecords = incoming.concat(allRecords);
        } else {
          allRecords = incoming;
        }

        // Update total yang diketahui client
        if (res.total !== undefined) cachedTotal = res.total;

        // Filter duplikat NIM + sesi + tanggal, ambil yang pertama
        var seen = {};
        var unik = allRecords.filter(function(d) {
          var tgl = String(d.waktu).split(' ')[0] || String(d.waktu).split(',')[0];
          var key = String(d.nim) + '|' + String(d.sesi) + '|' + tgl;
          if (seen[key]) return false;
          seen[key] = true;
          return true;
        });

        isiFilterSesi(unik);
        renderTabel(unik);
        hitungStat(unik);
      } else { throw new Error(res.message); }
    })
    .catch(function(e) {
      spinner.style.display = 'none';
      tampilAlert('alertDash', 'danger', 'Gagal memuat data: ' + e.message);
    });
}

function isiFilterSesi(records) {
  var sesiSet = {};
  records.forEach(function(r) { if (r.sesi) sesiSet[r.sesi] = true; });
  var sel = document.getElementById('filterSesi');
  var current = sel.value;
  sel.innerHTML = '<option value="">Semua sesi</option>';
  Object.keys(sesiSet).forEach(function(s) {
    var opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
  sel.value = current;
  // Isi juga optgroup salin per sesi
  var og = document.getElementById('optgroupSesi');
  og.innerHTML = '';
  Object.keys(sesiSet).forEach(function(s) {
    var opt = document.createElement('option');
    opt.value = 'sesi:' + s;
    opt.textContent = s;
    og.appendChild(opt);
  });
}

function hitungStat(records) {
  document.getElementById('statTotal').textContent = records.length;
  document.getElementById('statHadir').textContent = records.filter(function(d) { return d.status === 'Hadir'; }).length;
  document.getElementById('statIzin').textContent  = records.filter(function(d) { return d.status === 'Izin';  }).length;
  document.getElementById('statSakit').textContent = records.filter(function(d) { return d.status === 'Sakit'; }).length;
}

function renderTabel(records) {
  var spinner = document.getElementById('loadingSpinner');
  var tabel   = document.getElementById('tabelAbsen');
  var empty   = document.getElementById('emptyState');
  var tbody   = document.getElementById('tbodyAbsen');
  spinner.style.display = 'none';
  if (!records.length) { empty.style.display = 'block'; tabel.style.display = 'none'; return; }
  empty.style.display = 'none'; tabel.style.display = 'table';
  tbody.innerHTML = '';
  var badgeMap = { 'Hadir':'badge-hadir', 'Izin':'badge-izin', 'Sakit':'badge-sakit' };

  // Kelompokkan per kelas + sesi
  var grup = {};
  var urutan = [];
  records.forEach(function(row) {
    var key = ss(row.kelas) + ' · ' + ss(row.sesi);
    if (!grup[key]) { grup[key] = []; urutan.push(key); }
    grup[key].push(row);
  });

  var nomor = 1;
  urutan.forEach(function(key) {
    // Baris header grup
    var th = document.createElement('tr');
    th.innerHTML = '<td colspan="8" style="background:rgba(79,142,247,0.08);color:var(--accent);font-size:12px;font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border);letter-spacing:0.3px;">'+key+' <span style="color:var(--muted);font-weight:400;">('+grup[key].length+' siswa)</span></td>';
    tbody.appendChild(th);

    // Baris data per grup
    grup[key].forEach(function(row) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td style="color:var(--muted)">'+nomor+'</td>'+
        '<td style="white-space:nowrap;font-size:11px;color:var(--muted)">'+ss(row.waktu)+'</td>'+
        '<td style="font-weight:500">'+ss(row.nama)+'</td>'+
        '<td style="font-family:monospace">'+ss(row.nim)+'</td>'+
        '<td style="color:var(--muted)">'+ss(row.kelas)+'</td>'+
        '<td style="color:var(--muted)">'+ss(row.sesi)+'</td>'+
        '<td><span class="badge '+(badgeMap[row.status]||'')+'">'+ss(row.status)+'</span></td>'+
        '<td style="color:var(--muted)">'+(ss(row.keterangan)||'—')+'</td>';
      tbody.appendChild(tr);
      nomor++;
    });
  });
}

function filterData() {
  var cari   = document.getElementById('filterCari').value.toLowerCase();
  var status = document.getElementById('filterStatus').value;
  var sesi   = document.getElementById('filterSesi').value;
  var filtered = allRecords.filter(function(d) {
    var okCari   = !cari   || (d.nama && d.nama.toLowerCase().indexOf(cari) >= 0) || (d.nim && String(d.nim).toLowerCase().indexOf(cari) >= 0);
    var okStatus = !status || d.status === status;
    var okSesi   = !sesi   || d.sesi   === sesi;
    return okCari && okStatus && okSesi;
  });
  renderTabel(filtered);
  hitungStat(filtered);
}

function exportCSV() {
  if (!allRecords.length) return;
  var header = ['Waktu','Nama','NIM/NIS','Kelas','Sesi','Status','Keterangan'];
  var rows = allRecords.map(function(d) { return [d.waktu,d.nama,d.nim,d.kelas,d.sesi,d.status,d.keterangan]; });
  var csv = [header].concat(rows).map(function(r) {
    return r.map(function(v) { return '"'+String(v||'').replace(/"/g,'""')+'"'; }).join(',');
  }).join('\n');
  var blob = new Blob(['\ufeff'+csv], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'absensi-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

function salinDaftar() {
  var filter = document.getElementById('pilihanSalin').value;
  var parts  = filter.split(':');
  var tipe   = parts[0];
  var nilai  = parts[1];
  var sumber;

  if (tipe === 'status') {
    sumber = nilai === 'semua' ? allRecords : allRecords.filter(function(d) { return d.status === nilai; });
  } else if (tipe === 'sesi') {
    sumber = allRecords.filter(function(d) { return d.sesi === nilai; });
  } else {
    sumber = allRecords;
  }

  if (!sumber.length) { alert('Tidak ada data untuk disalin.'); return; }

  var teks = sumber.map(function(d, i) {
    return (i + 1) + '. ' + (d.nama || '—') + ' (' + (d.nim || '—') + ')';
  }).join('\n');

  navigator.clipboard.writeText(teks).then(function() {
    alert('Tersalin ' + sumber.length + ' data ke clipboard!');
  }).catch(function() {
    prompt('Salin teks di bawah ini:', teks);
  });
}

// ── Kelola Sesi ───────────────────────────────
function muatInfoSesi() {
  fetchSafe(ADMIN_CONFIG.SCRIPT_URL + '?action=getSesi')
    .then(function(res) {
      var el = document.getElementById('infoSesiAktif');
      if (res.status === 'ok' && res.sesi) {
        var s = res.sesi;
        var ms = pad(s.jamMulai)+':'+pad(s.menitMulai);
        var ss2 = pad(s.jamSelesai)+':'+pad(s.menitSelesai);
        el.innerHTML =
          '<div class="sesi-aktif-info">'+
          '<div class="judul">Sesi sedang aktif</div>'+
          '<div class="sesi-detail-row"><span class="dk">Kelas</span><span class="dv">'+s.kelas+'</span></div>'+
          '<div class="sesi-detail-row"><span class="dk">Sesi</span><span class="dv">'+s.sesi+'</span></div>'+
          '<div class="sesi-detail-row"><span class="dk">Waktu</span><span class="dv">'+ms+' – '+ss2+'</span></div>'+
          '<div class="sesi-detail-row"><span class="dk">Radius</span><span class="dv">'+s.radius+' meter</span></div>'+
          '<div style="margin-top:12px;"><button class="btn btn-danger" style="width:100%" onclick="nonaktifkanSesi()"> Nonaktifkan sesi ini</button></div>'+
'</div>';
        // Isi form dengan nilai sesi aktif sebagai default
        document.getElementById('sKelas').value     = s.kelas;
        document.getElementById('sSesi').value      = s.sesi;
        document.getElementById('sJamMulai').value  = s.jamMulai;
        document.getElementById('sMemulai').value   = s.menitMulai;
        document.getElementById('sJamSelesai').value = s.jamSelesai;
        document.getElementById('sMeSelesai').value  = s.menitSelesai;
        document.getElementById('sLat').value       = s.latPusat;
        document.getElementById('sLng').value       = s.lngPusat;
        document.getElementById('sRadius').value    = s.radius;
      } else {
        el.innerHTML = '<div class="no-sesi">Belum ada sesi yang aktif. Isi form di bawah untuk mengaktifkan sesi baru.</div>';
      }
    })
    .catch(function() {});
}

function simpanSesi() {
  var kelas      = document.getElementById('sKelas').value.trim();
  var sesi       = document.getElementById('sSesi').value.trim();
  var jamMulai   = document.getElementById('sJamMulai').value;
  var menitMulai = document.getElementById('sMemulai').value;
  var jamSelesai = document.getElementById('sJamSelesai').value;
  var menitSls   = document.getElementById('sMeSelesai').value;
  var lat        = document.getElementById('sLat').value;
  var lng        = document.getElementById('sLng').value;
  var radius     = document.getElementById('sRadius').value;
  var alertSesi  = document.getElementById('alertSesi');
  var btn        = document.getElementById('btnSimpanSesi');

  if (!kelas || !sesi || !lat || !lng) {
    alertSesi.className = 'alert alert-warn show';
    alertSesi.textContent = 'Kelas, sesi, dan koordinat GPS wajib diisi.';
    return;
  }

  btn.disabled = true; btn.textContent = 'Menyimpan...';
  alertSesi.className = 'alert';

  var url = ADMIN_CONFIG.SCRIPT_URL +
    '?action=setSesi' +
    '&kelas='      + encodeURIComponent(kelas) +
    '&sesi='       + encodeURIComponent(sesi) +
    '&jamMulai='   + encodeURIComponent(jamMulai) +
    '&menitMulai=' + encodeURIComponent(menitMulai) +
    '&jamSelesai=' + encodeURIComponent(jamSelesai) +
    '&menitSelesai='+ encodeURIComponent(menitSls) +
    '&latPusat='   + encodeURIComponent(lat) +
    '&lngPusat='   + encodeURIComponent(lng) +
    '&radius='     + encodeURIComponent(radius);

  fetchSafe(url)
    .then(function(res) {
      if (res.status === 'ok') {
        alertSesi.className = 'alert alert-success show';
        alertSesi.textContent = 'Sesi berhasil diaktifkan! Siswa sekarang bisa absen.';
        muatInfoSesi();
      } else { throw new Error(res.message); }
    })
    .catch(function(e) {
      alertSesi.className = 'alert alert-danger show';
      alertSesi.textContent = '❌ Gagal: ' + e.message;
    })
    .finally(function() {
      btn.disabled = false; btn.textContent = 'Aktifkan sesi ini';
    });
}

function nonaktifkanSesi() {
  if (!confirm('Yakin ingin menonaktifkan sesi? Siswa tidak akan bisa absen.')) return;
  var url = ADMIN_CONFIG.SCRIPT_URL + '?action=setSesi&kelas=&sesi=&jamMulai=0&menitMulai=0&jamSelesai=0&menitSelesai=0&latPusat=0&lngPusat=0&radius=0&nonaktif=1';
  fetchSafe(url)
    .then(function() {
      document.getElementById('alertSesi').className = 'alert alert-success show';
      document.getElementById('alertSesi').textContent = 'Sesi berhasil dinonaktifkan.';
      muatInfoSesi();
    });
}

// ── Helpers ───────────────────────────────────
function tampilAlert(id, tipe, pesan) {
  var el = document.getElementById(id);
  el.className = 'alert alert-'+tipe+' show';
  el.textContent = pesan;
}

function ss(val) {
  if (val === null || val === undefined) return '';
  return String(val).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function pad(n) { return String(n).padStart(2,'0'); }
