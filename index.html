<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Online</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --accent: #4f8ef7;
    --accent2: #7c6af7;
    --success: #22c55e;
    --danger: #ef4444;
    --warn: #f59e0b;
    --text: #e8eaf0;
    --muted: #8891a8;
    --radius: 14px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }
  header .logo {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 28px; margin-bottom: 12px;
  }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  header p { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 16px;
  }

  .status-row {
    display: flex; gap: 10px; margin-bottom: 20px;
  }
  .status-badge {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 12px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .status-badge .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .status-badge .val { font-weight: 600; font-size: 13px; }
  .status-badge.ok { border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.06); }
  .status-badge.ok .val { color: var(--success); }
  .status-badge.err { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.06); }
  .status-badge.err .val { color: var(--danger); }
  .status-badge.checking { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.06); }
  .status-badge.checking .val { color: var(--warn); }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 13px; color: var(--muted);
    margin-bottom: 6px; font-weight: 500;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.2s;
    outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
  }
  .field textarea { resize: vertical; min-height: 80px; }
  .field select option { background: var(--card); }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 16px;
    display: none;
    line-height: 1.5;
  }
  .alert.show { display: block; }
  .alert-danger { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
  .alert-success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
  .alert-warn { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3); color: #fbbf24; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 8px; }
  .info-row .key { color: var(--muted); }
  .info-row .value { font-weight: 500; }

  .clock {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -1px;
    text-align: center;
    padding: 12px 0 4px;
  }
  .date-str { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 16px; }

  .loading-dots::after {
    content: ''; animation: dots 1.2s infinite;
  }
  @keyframes dots {
    0% { content: ''; }
    33% { content: '.'; }
    66% { content: '..'; }
    100% { content: '...'; }
  }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo">🎓</div>
  <h1>Absensi Online</h1>
  <p id="namaInstitusi">Universitas / Sekolah</p>
</header>

<div class="card">
  <div class="clock" id="clockDisplay">--:--:--</div>
  <div class="date-str" id="dateDisplay">Memuat...</div>
  <div class="status-row">
    <div class="status-badge checking" id="badgeWaktu">
      <span class="label">Waktu</span>
      <span class="val" id="statusWaktu">Mengecek…</span>
    </div>
    <div class="status-badge checking" id="badgeLokasi">
      <span class="label">Lokasi</span>
      <span class="val" id="statusLokasi">Mengecek…</span>
    </div>
  </div>
  <div id="alertBox" class="alert"></div>
</div>

<div class="card" id="formCard" style="display:none;">
  <div class="info-row">
    <span class="key">Mata kuliah / Kelas</span>
    <span class="value" id="infoKelas">—</span>
  </div>
  <div class="info-row">
    <span class="key">Sesi absen</span>
    <span class="value" id="infoSesi">—</span>
  </div>
  <hr class="divider">

  <div class="field">
    <label>Nama lengkap</label>
    <input type="text" id="inputNama" placeholder="Masukkan nama lengkap" autocomplete="name">
  </div>
  <div class="field">
    <label>NIM / NIS</label>
    <input type="text" id="inputNim" placeholder="Masukkan NIM atau NIS" autocomplete="off">
  </div>
  <div class="field">
    <label>Status kehadiran</label>
    <select id="inputStatus">
      <option value="Hadir">✅ Hadir</option>
      <option value="Izin">📄 Izin</option>
      <option value="Sakit">🏥 Sakit</option>
    </select>
  </div>
  <div class="field">
    <label>Keterangan (opsional)</label>
    <textarea id="inputKet" placeholder="Catatan tambahan jika ada..."></textarea>
  </div>

  <div id="alertForm" class="alert"></div>

  <button class="btn btn-primary" id="btnSubmit" onclick="submitAbsen()">
    Kirim Absensi
  </button>
</div>

<footer>Data dikirim ke Google Sheets · Aman & terenkripsi</footer>

<script>
// =============================================
// ⚙️ KONFIGURASI — SESUAIKAN DI SINI
// =============================================
const CONFIG = {
  // URL dari Google Apps Script Web App kamu
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbwLuizePSSf0cV7hznlntnCYQ8FF38jYbbohOWyfMzb_zjOqI57eGu2YxmO8_t-zkqeRQ/exec",

  // Nama institusi yang tampil di atas
  NAMA_INSTITUSI: "Universitas Contoh",

  // Nama kelas / mata kuliah
  NAMA_KELAS: "Pemrograman Web",

  // Nama sesi/pertemuan
  NAMA_SESI: "Pertemuan 5",

  // Batas waktu absen (format 24 jam)
  JAM_MULAI: 7,   // 07:00
  MENIT_MULAI: 0,
  JAM_SELESAI: 8, // 08:30
  MENIT_SELESAI: 30,

  // Koordinat pusat lokasi yang diizinkan
  // (titik tengah kampus/sekolah)
  LAT_PUSAT: -2.5489,   // ganti dengan koordinat kampus
  LNG_PUSAT: 116.3547,  // ganti dengan koordinat kampus

  // Radius maksimal dalam meter (misal 200 meter)
  RADIUS_METER: 200,

  // Mode debug: true = lewati cek GPS & waktu (untuk testing)
  DEBUG_MODE: false,
};
// =============================================

document.getElementById('namaInstitusi').textContent = CONFIG.NAMA_INSTITUSI;
document.getElementById('infoKelas').textContent = CONFIG.NAMA_KELAS;
document.getElementById('infoSesi').textContent = CONFIG.NAMA_SESI;

let statusWaktuOK = false;
let statusLokasiOK = false;
let userCoords = null;

// Jam digital real-time
function updateClock() {
  const now = new Date();
  const jam = String(now.getHours()).padStart(2, '0');
  const menit = String(now.getMinutes()).padStart(2, '0');
  const detik = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('clockDisplay').textContent = `${jam}:${menit}:${detik}`;

  const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][now.getDay()];
  const tgl = now.getDate();
  const bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][now.getMonth()];
  const thn = now.getFullYear();
  document.getElementById('dateDisplay').textContent = `${hari}, ${tgl} ${bln} ${thn}`;

  cekWaktu(now);
}

function cekWaktu(now) {
  const totalMenitSekarang = now.getHours() * 60 + now.getMinutes();
  const totalMenitMulai = CONFIG.JAM_MULAI * 60 + CONFIG.MENIT_MULAI;
  const totalMenitSelesai = CONFIG.JAM_SELESAI * 60 + CONFIG.MENIT_SELESAI;

  const badge = document.getElementById('badgeWaktu');
  const stat = document.getElementById('statusWaktu');
  const alert = document.getElementById('alertBox');

  if (CONFIG.DEBUG_MODE) {
    statusWaktuOK = true;
    badge.className = 'status-badge ok';
    stat.textContent = 'Debug ✓';
    cekLokasi();
    return;
  }

  if (totalMenitSekarang >= totalMenitMulai && totalMenitSekarang <= totalMenitSelesai) {
    if (!statusWaktuOK) {
      statusWaktuOK = true;
      badge.className = 'status-badge ok';
      stat.textContent = 'Dalam sesi ✓';
      cekLokasi();
    }
  } else {
    statusWaktuOK = false;
    badge.className = 'status-badge err';
    const mulai = `${String(CONFIG.JAM_MULAI).padStart(2,'0')}:${String(CONFIG.MENIT_MULAI).padStart(2,'0')}`;
    const selesai = `${String(CONFIG.JAM_SELESAI).padStart(2,'0')}:${String(CONFIG.MENIT_SELESAI).padStart(2,'0')}`;
    stat.textContent = `${mulai}–${selesai}`;
    alert.className = 'alert alert-warn show';
    alert.textContent = `⏰ Absensi hanya dibuka pukul ${mulai} – ${selesai}. Silakan kembali saat sesi dimulai.`;
    document.getElementById('formCard').style.display = 'none';
  }
}

function hitungJarak(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const phi1 = lat1 * Math.PI / 180;
  const phi2 = lat2 * Math.PI / 180;
  const dphi = (lat2 - lat1) * Math.PI / 180;
  const dlambda = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dphi/2)**2 + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dlambda/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function cekLokasi() {
  const badge = document.getElementById('badgeLokasi');
  const stat = document.getElementById('statusLokasi');
  const alert = document.getElementById('alertBox');

  if (CONFIG.DEBUG_MODE) {
    statusLokasiOK = true;
    badge.className = 'status-badge ok';
    stat.textContent = 'Debug ✓';
    tampilkanForm();
    return;
  }

  badge.className = 'status-badge checking';
  stat.innerHTML = '<span class="loading-dots">Mencari</span>';

  if (!navigator.geolocation) {
    badge.className = 'status-badge err';
    stat.textContent = 'Tidak didukung';
    alert.className = 'alert alert-danger show';
    alert.textContent = '❌ Browser kamu tidak mendukung GPS. Coba gunakan Chrome atau Firefox terbaru.';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      const jarak = hitungJarak(userCoords.lat, userCoords.lng, CONFIG.LAT_PUSAT, CONFIG.LNG_PUSAT);
      const jarakBulat = Math.round(jarak);

      if (jarak <= CONFIG.RADIUS_METER) {
        statusLokasiOK = true;
        badge.className = 'status-badge ok';
        stat.textContent = `${jarakBulat}m dari pusat ✓`;
        alert.className = 'alert';
        tampilkanForm();
      } else {
        statusLokasiOK = false;
        badge.className = 'status-badge err';
        stat.textContent = `${jarakBulat}m (terlalu jauh)`;
        alert.className = 'alert alert-danger show';
        alert.textContent = `📍 Lokasimu ${jarakBulat} meter dari titik absen. Batas maksimal: ${CONFIG.RADIUS_METER} meter. Pastikan kamu berada di dalam area yang ditentukan.`;
        document.getElementById('formCard').style.display = 'none';
      }
    },
    (err) => {
      badge.className = 'status-badge err';
      const pesan = {
        1: 'Izin lokasi ditolak. Aktifkan izin lokasi di browser.',
        2: 'Lokasi tidak terdeteksi. Coba di luar ruangan.',
        3: 'Waktu habis. Coba refresh halaman.'
      };
      stat.textContent = 'Gagal';
      alert.className = 'alert alert-danger show';
      alert.textContent = `📍 ${pesan[err.code] || 'Gagal mendapatkan lokasi.'}`;
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function tampilkanForm() {
  if (statusWaktuOK && statusLokasiOK) {
    document.getElementById('alertBox').className = 'alert';
    document.getElementById('formCard').style.display = 'block';
  }
}

async function submitAbsen() {
  const nama = document.getElementById('inputNama').value.trim();
  const nim = document.getElementById('inputNim').value.trim();
  const status = document.getElementById('inputStatus').value;
  const ket = document.getElementById('inputKet').value.trim();
  const alertForm = document.getElementById('alertForm');
  const btn = document.getElementById('btnSubmit');

  if (!nama) {
    alertForm.className = 'alert alert-warn show';
    alertForm.textContent = '⚠️ Nama lengkap wajib diisi.';
    return;
  }
  if (!nim) {
    alertForm.className = 'alert alert-warn show';
    alertForm.textContent = '⚠️ NIM / NIS wajib diisi.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Mengirim...';
  alertForm.className = 'alert';

  const now = new Date();
  const payload = {
    nama,
    nim,
    status,
    keterangan: ket,
    kelas: CONFIG.NAMA_KELAS,
    sesi: CONFIG.NAMA_SESI,
    waktu: now.toLocaleString('id-ID'),
    lat: userCoords?.lat || 'debug',
    lng: userCoords?.lng || 'debug',
  };

  try {
    const res = await fetch(CONFIG.SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (data.status === 'ok') {
      document.getElementById('formCard').style.display = 'none';
      const alertBox = document.getElementById('alertBox');
      alertBox.className = 'alert alert-success show';
      alertBox.textContent = `✅ Absensi berhasil dicatat! Halo ${nama}, kehadiranmu sudah tersimpan.`;
    } else {
      throw new Error(data.message || 'Gagal menyimpan');
    }
  } catch (e) {
    alertForm.className = 'alert alert-danger show';
    alertForm.textContent = `❌ Gagal mengirim: ${e.message}. Pastikan URL Apps Script sudah benar.`;
    btn.disabled = false;
    btn.textContent = 'Kirim Absensi';
  }
}

setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
